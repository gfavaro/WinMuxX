  <g font-family="system-ui,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172033"><text x="199" y="185">Master</text><text x="499" y="78">Stack 1</text><text x="499" y="185">Stack 2</text><text x="499" y="292">Stack 3</text></g>
</svg>
