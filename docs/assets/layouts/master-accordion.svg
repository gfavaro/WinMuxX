<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Master with accordion stack</title><desc id="desc">The master is on the left. The selected stack window fills the right, with neighboring windows peeking at the bottom.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/><rect x="24" y="24" width="350" height="312" rx="10" fill="#bfdbfe"/><rect x="382" y="24" width="234" height="264" rx="10" fill="#bbf7d0"/><rect x="382" y="297" width="234" height="39" rx="8" fill="#fde68a"/>
  <g font-family="system-ui,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172033"><text x="199" y="185">Master</text><text x="499" y="160">Selected stack window</text><text x="499" y="324" font-size="15">Neighbor peeking</text></g>
</svg>
