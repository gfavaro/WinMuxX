<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Window tab group</title><desc id="desc">Two tabs share one window frame; the selected tab's content fills the group.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/><rect x="24" y="24" width="592" height="312" rx="12" fill="#cbd5e1"/><rect x="36" y="36" width="190" height="44" rx="8" fill="#bfdbfe"/><rect x="234" y="36" width="190" height="44" rx="8" fill="#e2e8f0"/><rect x="36" y="90" width="568" height="234" rx="8" fill="#dcfce7"/>
  <g font-family="system-ui,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#172033"><text x="131" y="64">Selected tab</text><text x="329" y="64">Other tab</text><text x="320" y="215">Shared tab group frame</text></g>
</svg>
