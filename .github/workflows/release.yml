name: Personal release

on:
  push:
    tags: ['gf-v*']

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'gfavaro/WinMuxX'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and integration ancestry
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_REF" = "gf-v$version"
          git merge-base --is-ancestor HEAD origin/main
      - name: Install pinned Swift
        run: |
          brew install swiftly
          swiftly init --skip-install --assume-yes --verbose
          swiftly install
      - name: Test
        run: make check
      - name: Build isolated personal app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: make fork-build BUILD_NUMBER="$BUILD_NUMBER"
      - name: Publish personal release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          gh release create "$RELEASE_REF" ".release/WinMuxX-$version-$BUILD_NUMBER.zip" \
            --verify-tag --generate-notes --title "WinMuxX $version" \
            --notes 'Personal fork build. Ad hoc signed, not notarized. Automatic updates are disabled.'
