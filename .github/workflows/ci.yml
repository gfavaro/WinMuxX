name: CI

on:
  workflow_dispatch:
  pull_request:
  # Work is committed straight to main, so this is the only run on the pinned toolchain.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'site/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Swift toolchain
        run: |
          brew install swiftly
          swiftly init --skip-install --assume-yes --verbose
          swiftly install

      - name: Record tool versions
        run: |
          source ./script/setup.sh
          swift --version
          xcodebuild -version

      - name: Set up Python for schema tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install pinned config schema test dependencies
        run: |
          python3 -m venv .deps/config-schema
          ./.deps/config-schema/bin/pip install --requirement requirements-schema.txt

      - name: Build and test
        run: make check

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.run_number }}
          path: |
            .build/test-output.log
            .build/native-overlay-fixtures/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Build personal app
        # Pushes to main are tested only; apps come from pull requests, on demand and release tags.
        if: github.repository == 'gfavaro/WinMuxX' && github.event_name != 'push'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CODESIGN_IDENTITY: '-'
        run: make fork-build BUILD_NUMBER="$BUILD_NUMBER"
