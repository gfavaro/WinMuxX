name: Suggest upstream synchronization

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'gfavaro/WinMuxX'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream into a review branch only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/ZimengXiong/WinMux.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Upstream is already integrated.'
            exit 0
          fi
          if gh pr list --state open --json headRefName --jq '.[].headRefName' | grep -q '^sync/upstream-'; then
            echo 'An upstream synchronization PR is already pending.'
            exit 0
          fi
          branch="sync/upstream-$(git rev-parse --short=12 upstream/main)"
          git switch -c "$branch"
          if ! git -c core.editor=true merge --no-edit upstream/main; then
            git merge --abort
            echo 'Upstream conflicts require a manual integration branch. main was not modified.' >&2
            exit 1
          fi
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'Integrate upstream changes' \
            --body 'Review upstream changes, fork identity, updater isolation, defaults and CI before merging. No automatic merge is performed. CI is dispatched explicitly on this branch; verify its result in Actions before merging.'
          gh workflow run ci.yml --ref "$branch"
